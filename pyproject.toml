[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["inventory/tests"]
addopts = "--strict-markers --cov=inventory --cov-report=term-missing --cov-report=xml --cov-fail-under=85"

[tool.coverage.run]
omit = ["*/migrations/*", "*/tests/*"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["venv", "inventory/migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
